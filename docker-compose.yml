  #     - ./media:/var/www/media:ro
  #     - protected_videos:/var/protected_videos:ro

  #     # - certbot_www:/var/www/certbot
  #     - ./certbot-webroot:/var/www/certbot
  #     - certbot_certs:/etc/letsencrypt
  #   depends_on:
  #     - backend
  #   networks:
  #     - tisa_network


  # certbot:
  #   image: certbot/certbot
  #   container_name: certbot
  #   volumes:
  #     - ./certbot-webroot:/var/www/certbot
  #     # - certbot_www:/var/www/certbot
  #     - certbot_certs:/etc/letsencrypt
  #   networks:
  #     - tisa_network

volumes:
  postgres_data:
  tisa_static:
    external: true
    name: tisa_static
  protected_videos:
    external: true
    name: protected_videos

  # certbot_www:
  # certbot_certs:

networks:
  tisa_network:
    external: true
    name: shared_net
