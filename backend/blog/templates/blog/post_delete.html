{% extends "_base.html" %}
{% load i18n %}

{% block page_title %}حذف مقاله{% endblock %}

{% block content %}

<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-5 text-center border-0">

          <h3 class="fw-bold mb-4 text-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            حذف مقاله
          </h3>

          <p class="text-muted mb-2">شما در حال حذف دائمی مقاله زیر هستید:</p>
          <p class="fw-bold fs-5 text-dark">«{{ post.title }}»</p>
          
          <p class="text-danger small mt-3">این عملیات قابل بازگشت نیست.</p>

          <form method="post" class="d-flex justify-content-center gap-3 mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">
              <i class="bi bi-trash me-1"></i>
              حذف مقاله
            </button>
            <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary px-4">
              <i class="bi bi-arrow-right-circle me-1"></i>
              بازگشت به مقاله
            </a>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
