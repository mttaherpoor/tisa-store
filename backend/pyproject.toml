[project]
name = "backend"
version = "0.1.0"
description = "Tisa backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "django==5.1.6",

    # Authentication
    "django-allauth==65.4.1",

    # Forms
    "django-crispy-forms==2.3",
    "crispy-bootstrap5==2024.10",

    # Database
    "psycopg2-binary==2.9.10",
    "dj-database-url==2.3.0",

    # Environment variables
    "environs==14.1.1",
    "python-dotenv==1.0.1",

    # Email
    "dj-email-url==1.0.6",

    # CMS / Editor
    "django-ckeditor-5==0.2.17",

    # Localization
    "django-rosetta==0.10.1",
    "django-jalali-date==1.1.3",
    "jdatetime==5.2.0",

    # Image handling
    "pillow==11.1.0",

    # HTTP/API
    "requests==2.32.3",

    # Slugs
    "python-slugify==8.0.4",

    # Background tasks
    "celery==5.5.3",

    # Storage (S3/MinIO)
    "boto3",
    "django-storages",

    # Production server
    "gunicorn>=21",
]